[[items]]
answer = '<p>MKP&nbsp;Support&nbsp;是一个<strong>开源项目</strong>，核心功能是在3D打印的支撑面自动涂胶，创始人为<a target="_blank" rel="noopener noreferrer" href="https://space.bilibili.com/1475765743"><span style="color: rgb(239, 68, 68);"><u>@Jhmodel喵</u></span></a><span style="color: rgb(239, 68, 68);"><u>~</u></span></p><img src="assets/faq/faq2_1.webp"><p>MKP&nbsp;SupportE&nbsp;即该软件为群友（孜羊调味粉）根据开源代码重构的程序，拥有较为现代化的页面、极致的体积以及一些新增功能（比如涂胶z方向补偿四角双线性插值）。</p><img src="assets/faq/faq2_2.webp"><p>涂胶后胶水干透形成薄膜，阻碍耗材之间粘连，降低层间结合力，从而让支撑接触面<strong>光滑平整</strong>，支撑轻松易拆，对比双头的优势：</p><p>1、无需购买新机器，旧机器也可以安装。</p><p>2、比双料支撑更粘，减少翘边概率</p><p>缺点：</p><p>1、和多头一样也需要擦料塔</p><p>2、不能说很稳定，可能有很多小问题</p>'
category = '基础入门'
categoryColor = '#3B82F6'
id = 'faq-001'
order = 2.0
question = '<p>MKP Support是什么？有什么用？</p>'

[[items]]
answer = '<p>标准版：换笔芯需要拧螺丝，建议<a target="_blank" rel="noopener noreferrer" href="https://m.tb.cn/h.R1AvlyJ?tk=kgdy5spOuNX"><span style="color: rgb(239, 68, 68);"><u>直接买标准版成品</u></span></a>划算，自己组装的话多买一些磁铁都试试。</p><p>快拆版：外观好看，设计风格更统一，可以<a target="_blank" rel="noopener noreferrer" href="https://m.tb.cn/h.RX34omy?tk=DRRl5spNjzX"><span style="color: rgb(239, 68, 68);"><u>买快拆版成品</u></span></a>支持一下作者。换笔芯很方便，多次迭代更新，不干涉自动换盘的板夹，做了更稳的收笔，第三层的裹头检测也不会影响打印。</p><p></p><p>但是一些通病无法避免</p><p>（笔尖质量不行，可能遇到漏胶水，回流，不出胶等问题，跟打印件版本无关）</p>'
category = '基础入门'
categoryColor = '#3B82F6'
id = 'faq-002'
order = 3.0
question = '<p>标准版和快拆版有什么区别？</p>'

[[items]]
answer = '<p>目前软件支持 <strong>Windows 10/11 (64位)</strong> 以及 <strong>macOS 12.0 及以上版本</strong>（包含 Intel 与 Apple Silicon M系列芯片）。</p>'
category = '基础入门'
categoryColor = '#3B82F6'
id = 'faq-003'
