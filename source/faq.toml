question = '软件支持哪些操作系统？'

[[items]]
answer = '<p><strong>不需要。</strong></p><p>核心处理引擎完全在本地离线运行，不会上传您的任何模型数据。仅在下载云端预设、检查版本更新时需要短暂联网。</p>'
category = '基础入门'
categoryColor = '#3B82F6'
id = 'faq-004'
