question = '涂胶时停顿十几秒？'

[[items]]
answer = '<p><strong>关闭擦料塔就是棒棒糖模式</strong>。</p><p>棒棒糖模式暂时不完善。新手建议使用擦嘴塔模式，涂胶更稳定。</p>'
