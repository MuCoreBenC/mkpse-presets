[[items]]
answer = '<p>Z轴偏移校准用于<strong>微调笔芯与支撑面的距离</strong>。</p><p>•&nbsp;距离合适：支撑接触面完美粘附并容易拆除</p><p>•&nbsp;距离过近：导致撞支撑，前盖脱落</p><p>•&nbsp;距离过远：涂不上胶水</p><p>警告：Z值无论如何不能小于0！</p>'
category = '校准指南'
categoryColor = '#EC4899'
id = 'faq-035'
order = 31.0
question = 'Z轴偏移校准的作用？'

[[items]]
answer = '<p>XY轴偏移校准用于调整笔芯<strong>水平精确度</strong>。</p><p>主要作用：</p><p>1.&nbsp;确保涂胶路径准确</p><p>2.&nbsp;确保不涂到模型</p><p>3.&nbsp;确保不偏离支撑面撞到外墙</p>'
category = '校准指南'
categoryColor = '#EC4899'
id = 'faq-036'
order = 32.0
question = 'XY轴偏移校准有什么作用？'

[[items]]
answer = '<p>必须先校准Z，再校准XY。</p><p>Z轴偏移是基础，XY偏移依赖Z轴的正确值。如果Z轴不准，XY校准会比较难。</p><p>重要：Z值无论如何不能小于0！</p>'
category = '校准指南'
categoryColor = '#EC4899'
id = 'faq-037'
order = 33.0
question = '校准顺序是什么？'

[[items]]
answer = '<p>可能是<span style="color: rgb(230, 0, 0);">没重新切片</span></p><p>在BBS里面更改热床类型，再改回去重新切片就行了</p><img src="assets/faq/faq34_1.webp">'
category = '校准指南'
categoryColor = '#EC4899'
id = 'faq-039'
order = 34.0
question = '校准保存后数值没生效怎么办？'

[[items]]
answer = '<p>排查步骤：</p><p>看看是不是标准版但用了快拆版的</p><p>或者快拆版用了标准版的预设文件</p><p>其实这是正常的，可能默认参考的XY不准</p><p>只要中间方块能均匀的涂上一点就行了</p><p>如果看不到涂胶效果可以用手摸一下看看粘不粘</p><p>校准好Z轴之后，再去校准XY</p>'
category = '校准指南'
categoryColor = '#EC4899'
id = 'faq-040'
order = 35.0
question = 'Z校准涂胶只能涂一半怎么办？'

[[items]]
answer = '<p>可能是由于操作不当被覆盖了</p><p>在校准偏移页面点击校准记录</p><img src="assets/faq/faq36_1.webp"><p>可以看到以前使用的XYZ偏移</p><p>可以在预设管理页面的回收站看一看</p><img src="assets/faq/faq36_2.webp"><p>还可以在修改参数页面的修改历史里面找</p><img src="assets/faq/faq36_3.webp"><p>建议自己截图保存下来xyz的值，或者另存为</p><img src="assets/faq/faq36_4.webp">'
