[[items]]
answer = '<p>棒棒糖模式下这是正常现象，停顿是升降温程序在运行。</p><p>擦嘴塔模式不会停这么久，可能是设置了额外干燥时间，改成0秒即可。</p>'
category = '打印实战'
categoryColor = '#3B82F6'
id = 'faq-045'
