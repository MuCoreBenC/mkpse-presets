question = '重新下载预设后坐标变了怎么办？'

[[items]]
answer = '<p>支撑难拆的排查步骤：</p><p>1.&nbsp;检查<strong>出胶量</strong>是否充足</p><p>2.&nbsp;检查<strong>XYZ轴偏移</strong>是否校准</p><p>3.&nbsp;建议使用擦嘴塔而非棒棒糖模式</p><p>4. 普通支撑确实难拆一点，但是支撑面效果好一点。</p><p>5. 树状支撑好拆但是效果可能差一点（而且要用混合树）</p>'
category = '打印实战'
categoryColor = '#3B82F6'
id = 'faq-042'
order = 37.0
question = '支撑难拆怎么办？'

[[items]]
answer = '<p>解决方法：</p><p>1.&nbsp;<strong>关闭移除小悬空</strong>选项</p><p>2.&nbsp;更新到最新版本，打开支撑熨烫</p><p>3.&nbsp;增加接触面层数&nbsp;—&nbsp;顶部设为2-3层</p>'
category = '打印实战'
categoryColor = '#3B82F6'
id = 'faq-043'
