question = '需要全程联网吗？'

[[items]]
answer = '<p>各机型支持情况如下：</p><p><span style="color: rgb(29, 78, 216);"><strong>•&nbsp;A1&nbsp;/&nbsp;A1&nbsp;mini&nbsp;—&nbsp;支持（相关的bom在群文件获取，注意A1和mini的打印件不一样）</strong></span></p><img src="assets/faq/faq6_1.webp"><p><span style="color: rgb(29, 78, 216);"><strong>•&nbsp;P1&nbsp;/&nbsp;X1&nbsp;系列&nbsp;—&nbsp;支持（相关的bom在群文件获取，注意P1和X1的打印件不一样）</strong></span></p><img src="assets/faq/faq6_2.webp"><img src="assets/faq/faq6_3.webp"><p><span style="color: rgb(249, 115, 22);">•&nbsp;P2S&nbsp;—&nbsp;即将支持（无限期搁置）</span></p>'
category = '基础入门'
categoryColor = '#3B82F6'
id = 'faq-006'
order = 6.0
question = '我的机型支持吗？'

[[items]]
answer = '<p>新手可以买标准版成品，便宜性价比高，群主负责售后。</p><p>快拆版也有成品，稍贵，建议自己组装，<strong>多余的材料可以尝试两种版本。</strong></p>'
category = '基础入门'
categoryColor = '#3B82F6'
id = 'faq-007'
order = 7.0
question = '<p>A1新手应该选标准版还是快拆版？</p>'

[[items]]
answer = '<p>在后处理的时候，先找出支撑面和支撑熨烫面，插入一段切换的代码和偏移后的去掉挤出的路径。</p><p>让打印机在打印完支撑面（支撑熨烫面）之后执行插入的路径，执行涂胶。</p><p>胶水干透后在支撑接触面形成一层薄膜，<span style="color: rgb(239, 68, 68);"><strong><em>阻碍耗材之间的粘连</em></strong></span>，降低层间结合力。</p><p>这样支撑与模型之间的表现更好，接触面光滑平整。</p>'
category = '基础入门'
categoryColor = '#3B82F6'
id = 'faq-008'
order = 8.0
question = '<p>MKP涂胶的原理是什么？</p>'

[[items]]
answer = '<p>磁铁安装规则：</p><p>A系列：</p><p>标准版</p><p>•&nbsp;<strong>N35</strong>&nbsp;装外壳</p><p>•&nbsp;<strong>N52</strong>&nbsp;装夹具</p><p>判断极性：夹具和外壳上的磁铁应该相互吸引。</p><p><span style="color: rgb(239, 68, 68);">快拆版</span></p><p><span style="color: rgb(239, 68, 68);">只需要<strong>N52</strong>，同样是夹具和前盖相互吸引。</span></p><p>P和X系列：</p><p>根据工具头上磁铁的极性判断，外壳与工具头相互吸引即可。</p>'
category = '硬件装配'
categoryColor = '#22C55E'
id = 'faq-009'
order = 9.0
question = '<p>磁铁怎么装？极性怎么判断？</p>'

[[items]]
answer = '<p>常见原因及解决方法：</p><p>1.&nbsp;磁极装反&nbsp;—&nbsp;最常见原因，检查磁铁极性</p><p>标准版：</p><p>2.&nbsp;磁铁突出&nbsp;—&nbsp;重新安装使磁铁平齐</p><p>3.&nbsp;间隙太小&nbsp;—&nbsp;打磨夹具间距</p><img src="assets/faq/faq10_1.webp"><p>快拆版：</p><p><s>4.&nbsp;快拆版的挡片卡住，需要打磨象脚和锐边</s><span style="color: rgb(239, 68, 68);">260628版本已经解决了不再需要挡片。</span></p>'
category = '硬件装配'
categoryColor = '#22C55E'
id = 'faq-010'
order = 10.0
question = 'A1笔压不下去/抬不起来怎么办？'

[[items]]
answer = '<p>排查步骤：</p><p>1.&nbsp;检查磁铁是否<strong>突出或松动</strong></p><p>2.&nbsp;笔芯夹具和外壳之间涂润滑脂</p><p></p>'
category = '硬件装配'
categoryColor = '#22C55E'
id = 'faq-011'
order = 11.0
question = 'A1上下活动不流畅怎么办？'

[[items]]
answer = '<p>笔尖脱落的常见原因：</p><p>1.&nbsp;小面积细长条区域快速振荡，笔尖被甩脱</p><p><span style="color: rgb(239, 68, 68);">2.&nbsp;Z轴太低，撞到外墙导致笔尖脱落</span></p>'
category = '硬件装配'
categoryColor = '#22C55E'
id = 'faq-012'
order = 12.0
question = '<p>A系列笔尖为什么会掉？</p>'

[[items]]
answer = '<p>可能原因：</p><p>P1/X1：</p><p>1.&nbsp;可能是管子压到框架导致的，也可能是没收笔就打印导致的</p><p>2.&nbsp;磁铁脱落</p><p>A1/A1&nbsp;mini：</p><p>1.&nbsp;笔尖XYZ偏移不准撞掉的</p>'
category = '硬件装配'
categoryColor = '#22C55E'
id = 'faq-013'
order = 13.0
question = '前盖会被撞掉怎么办？'

[[items]]
answer = '<p>P系列采用推杆结构，前盖脱落报警的常见原因：</p><p>1.&nbsp;P系列传感器较为敏感，轻微位移就会报警</p><p>2.&nbsp;确保磁铁吸附牢固</p><p><span style="color: rgb(239, 68, 68);">2.&nbsp;打开软件里面的防误报开关（即使真的脱落也没有警报，打印失败风险增加）</span></p>'
category = '硬件装配'
categoryColor = '#22C55E'
id = 'faq-014'
order = 14.0
question = '<p>P系列为什么总是报<span style="color: rgb(239, 68, 68);">前盖脱落？</span></p>'

[[items]]
answer = '<p>标准版的管子接好之后可以绑在电线也可以悬垂着</p><img src="assets/faq/faq15_1.webp"><p>快拆版的管子有软支撑，管子可以成一个拱形</p><img src="assets/faq/faq15_2.webp"><p>管子连接方法：将软管直接套在笔芯和胶箱上。</p><p>长度建议：<strong>30-50cm</strong>，不要太长也不要挂太高，可能影响出胶。</p><p>A1快拆版还有软支撑，厚一点的凸起那边插进笔芯夹具。</p><img src="assets/faq/faq15_3.webp">'
category = '硬件装配'
categoryColor = '#22C55E'
id = 'faq-015'
order = 15.0
question = '<p>管子多长合适？怎么用？</p>'

[[items]]
answer = '<p>安装要点：</p><img src="assets/faq/faq16_1.webp"><p>1.&nbsp;快拆版软管要套进第一个凸起的环再压紧拧紧</p><img src="assets/faq/faq16_2.webp"><p>2.&nbsp;要用钳子夹着拧，别用手拧，小心受伤</p><img src="assets/faq/faq16_3.webp"><p>3.&nbsp;安装好后<strong>用力拔也拔不出</strong>才算安装到位</p><p>4.&nbsp;未套到位会导致漏胶或脱落</p><p></p>'
category = '硬件装配'
categoryColor = '#22C55E'
id = 'faq-016'
order = 16.0
question = '管子安装要注意什么？'

[[items]]
answer = '<p>K90胶水配比：<strong>1:20</strong>（K90&nbsp;:&nbsp;水）</p><p>注意事项：</p><p>1.&nbsp;用水配制，不是酒精</p><p>2.&nbsp;加少量<strong>洗洁精</strong>作为润湿剂，帮助胶水均匀涂布</p><p></p><p>参考配比：（质量比）单位g</p><p>水：K90：洗洁精：甘油100：5：2：2</p><p></p><p></p>'
category = '胶水相关'
categoryColor = '#8B5CF6'
id = 'faq-019'
order = 17.0
question = 'K90胶水怎么配？'

[[items]]
answer = '<p>胶水过多的解决方法：</p><p>1. <strong>提高涂胶速度</strong> — 默认约70，可调到120-140</p><p>2. 胶箱不要装太满</p><p>3. 胶箱不要放太高</p>'
category = '胶水相关'
categoryColor = '#8B5CF6'
id = 'faq-020'
order = 18.0
question = '胶水太多怎么办？'

[[items]]
answer = '<p>排查步骤：</p><p>1. 检查笔尖是否<span style="color: rgb(239, 68, 68);">堵塞或损坏</span></p><p>2. 检查管内是否有气泡阻断出胶</p><p>3. 检查胶箱<strong>液位</strong>是否充足</p><p>4. 可以把盖子打开，不用拧紧，松几圈</p><p>5. 可以把胶箱垫高一点</p>'
category = '胶水相关'
categoryColor = '#8B5CF6'
id = 'faq-021'
order = 19.0
question = '胶水太少/不出胶怎么办？'

[[items]]
answer = '<p>可能原因及解决方法：</p><p>1. 胶水太多 — <strong>提高涂胶速度</strong>减少出胶量</p><img src="assets/faq/faq20_1.webp"><p>2. 风吹问题 — 风会把胶水吹到边缘聚集，导致局部不干</p><p>3. 涂完需要等待干燥，不要急于打印下一层，加几秒等待时间</p><img src="assets/faq/faq20_2.webp">'
category = '胶水相关'
categoryColor = '#8B5CF6'
id = 'faq-022'
order = 20.0
question = '胶水不干/干不了？'

[[items]]
answer = '<p>少量小气泡<strong>不影响使用</strong>，气泡会聚集在顶部只要不影响出胶可以不管。</p><p>如果气泡太多影响出胶，可以排一下气泡。</p>'
category = '胶水相关'
categoryColor = '#8B5CF6'
id = 'faq-023'
order = 21.0
question = '笔头涂胶时慢慢进小气泡？'

[[items]]
answer = '<p>长时间不用后笔尖胶水干涸凝固导致不出胶。</p><p>解决方法：</p><p>1.&nbsp;用<strong>水或酒精</strong>泡一会笔尖，再在纸上划几下恢复出胶。</p><p>2.&nbsp;换新的笔尖。</p><p>3.很久不用的话可以取下套笔帽存放。</p>'
category = '胶水相关'
categoryColor = '#8B5CF6'
id = 'faq-024'
order = 22.0
question = '很久不用就不出胶了怎么办？'

[[items]]
answer = '<p>涂胶速度参数的含义：</p><p>• 数字<strong>越大</strong> → 涂胶越快 → <span class="text-blue-600 font-medium">出胶越少</span></p><p>• 数字<strong>越小</strong> → 涂胶越慢 → 出胶越多</p><p>默认值约 <code>69-70</code>，胶水太多可调到 <code>120-200</code>。</p>'
category = '胶水相关'
categoryColor = '#8B5CF6'
id = 'faq-025'
order = 23.0
question = '涂胶速度参数是什么意思？'

[[items]]
answer = '<p>在&nbsp;Bambu&nbsp;Studio&nbsp;或&nbsp;OrcaSlicer&nbsp;中：</p><img src="assets/faq/faq24_1.webp"><p>1.&nbsp;打开切片软件，进入工艺&nbsp;→&nbsp;其他</p><p>2.&nbsp;找到后处理脚本选项框</p><p>3.&nbsp;点击本软件右上角的复制按钮，将命令粘贴进去</p><p>4.&nbsp;重新切片即可生效</p><img src="assets/faq/faq24_2.webp">'
category = '软件配置'
categoryColor = '#F97316'
id = 'faq-027'
order = 24.0
question = '后处理脚本如何配置？'

[[items]]
answer = '<p>如果您使用的是 Bambu Studio，请确保已经开启了<strong>"高级（Advanced）"</strong>或<strong>"开发者模式"</strong>开关（通常位于参数设置面板的右上角）。</p><p>只有在高级模式下，底部的"其他"选项卡才会显示后处理脚本输入框。</p><img src="assets/faq/faq25_1.webp">'
category = '软件配置'
categoryColor = '#F97316'
id = 'faq-028'
order = 25.0
question = '找不到切片软件的后处理脚本选项？'

[[items]]
answer = '<p>这通常是因为路径解析错误导致的，请检查以下几点：</p><p>1. 软件安装路径中是否包含<strong>中文或特殊符号</strong>？建议移动到全英文路径下（如 <code>D:\MKPSupportE</code>）。</p><p>2. 检查切片软件填写的路径两端是否遗漏了英文双引号 <code>""</code>。</p>'
category = '软件配置'
categoryColor = '#F97316'
id = 'faq-029'
order = 26.0
question = '切片后提示找不到脚本文件？'

[[items]]
answer = '<p>填了后处理脚本再选预设会导致BBS闪退，这是已知问题。</p><p>解决方法：</p><p>1.&nbsp;选预设前<span style="color: rgb(230, 0, 0);">先点击后处理脚本旁边的刷新圆圈按钮</span></p><p>2.&nbsp;再点击刷新预设的圆圈按钮</p>'
category = '软件配置'
categoryColor = '#F97316'
id = 'faq-030'
order = 27.0
question = '选工艺预设时BBS闪退怎么办？'

[[items]]
answer = '<p>切换预设步骤：</p><p>1.&nbsp;选预设前<span style="color: rgb(230, 0, 0);">先点击后处理脚本旁边的刷新圆圈按钮</span></p><p>2.&nbsp;点击内置工艺预设旁的弧形箭头/刷新圆圈按钮</p><p>3.&nbsp;点击下拉菜单选择MKP选项即可</p>'
category = '软件配置'
categoryColor = '#F97316'
id = 'faq-031'
