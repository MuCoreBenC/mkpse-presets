[[items]]
answer = '<p>在关于软件页面有对应的网站和链接，有视频教程和图文教程。</p><p>以下仅展示常用链接</p><p><a target="_blank" rel="noopener noreferrer" href="https://space.bilibili.com/1475765743"><em><u>江汉模型的个人空间-江汉模型个人主页-哔哩哔哩视频</u></em></a></p><img src="assets/faq/faq1_1.webp"><p><a target="_blank" rel="noopener noreferrer" href="https://www.bilibili.com/video/BV1rBRJB8EfJ/?vd_source=3acd5988b97df248a1d6d7fe2766764f"><em><u>MKP&nbsp;support教程（3D打印改善支撑面）「快拆版260326」_哔哩哔哩_bilibili</u></em></a></p><p></p><img src="assets/faq/faq1_2.webp"><p><a target="_blank" rel="noopener noreferrer" href="https://makerworld.com.cn/zh/@ragdoll"><em><u>布偶猫&nbsp;|&nbsp;Home&nbsp;-&nbsp;MakerWorld</u></em></a></p><p><a target="_blank" rel="noopener noreferrer" href="https://makerworld.com.cn/zh/models/2059552-kuai-chai-ban-mkp-support-a1he-mini-gai-shan-zhi-c#profileId-2644229"><em><u>快拆版MKP&nbsp;support（A1和mini）改善支撑面，顶部Z距离为0，20260326版&nbsp;-&nbsp;免费&nbsp;3D&nbsp;打印模型&nbsp;-&nbsp;MakerWorld</u></em></a></p>'
category = '基础入门'
