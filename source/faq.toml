question = '擦料塔怎么关？棒棒糖模式是什么？'

[[items]]
answer = '<p>高模型打印时擦料塔容易倒。</p><p>解决方法：</p><p><s>1.&nbsp;打开护套模式，加固擦料塔底座</s><span style="color: rgb(239, 68, 68);">效果不够，该软件已经弃用（可能群主的原版还在使用）</span></p><p></p><img src="assets/faq/faq42_1.webp"><p>2. 该软件已经引入斜肋外墙，更稳定</p><img src="assets/faq/faq42_2.webp"><p>3.&nbsp;给热床喷胶水让擦料塔粘的更牢固</p>'
category = '打印实战'
