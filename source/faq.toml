question = '支撑边缘下垂/有波浪纹？'

[[items]]
answer = '<p>MKP对树状支撑的支持有限，因为树状支撑的支撑面太小了不方便涂胶，建议使用普通支撑。</p><p>实在要用树状支撑，要用<span style="color: rgb(230, 0, 0);">混合树</span>，并且开支撑熨烫。</p><p></p>'
category = '打印实战'
categoryColor = '#3B82F6'
