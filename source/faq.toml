[[items]]
answer = '<p>涂胶时终止打印会导致笔杆处于伸出状态，下次打印直接撞断。</p><p>处理步骤：</p><p>1.&nbsp;更换新笔杆</p><p>2.&nbsp;换杆后需<strong>重新校准Z轴</strong></p><p>警告：涂胶时绝对不要终止打印！</p><p>每次打印之前，如果发现笔芯是伸出来的状态，记得手动归位</p>'
category = '故障排查'
categoryColor = '#22C55E'
id = 'faq-050'
order = 44.0
question = '笔杆撞断了怎么办？'

[[items]]
answer = '<p>最常见原因：<span class="text-red-600 font-medium">之前涂胶时终止了打印</span>，笔杆一直处于伸出状态没有收回。</p><p>下次打印时笔杆未收回就直接犁板子。</p><p class="text-red-500 font-medium mt-1">警告：涂胶时绝对不要终止打印！</p>'
category = '故障排查'
categoryColor = '#22C55E'
id = 'faq-051'
order = 45.0
question = '突然开始犁板子是怎么回事？'

[[items]]
answer = '<p>堵头的解决方法：</p><p>1. 调整<strong>回抽距离</strong>（伸笔代码中的E值）</p><p>2. <span class="text-yellow-600 font-medium">丝绸料</span>特别容易堵头，建议使用普通PLA</p>'
category = '故障排查'
categoryColor = '#22C55E'
id = 'faq-052'
order = 46.0
question = '打印中涂胶头堵头？'

[[items]]
answer = '<p>处理超大模型时，生成的 G-code 可能达到数千万行。传统软件在加载、解析和渲染过程中需要占用大量内存，因此可能出现卡顿、响应缓慢甚至内存不足的情况。</p><p><strong>本软件采用 Go + Wails 技术栈开发，针对大文件场景进行了优化：</strong></p><ul><li><p>高性能 Go 后端，充分利用现代多核 CPU</p></li><li><p>流式解析 G-code，避免一次性加载全部数据</p></li><li><p>更低的内存占用，减少大文件处理压力</p></li><li><p>前后端分离架构，界面响应更流畅</p></li></ul><p><strong>如果遇到卡顿，可尝试：</strong></p><ol><li><p>在切片软件中适当降低模型复杂度</p></li><li><p>减少过细的层高或不必要的细节</p></li><li><p>关闭其他占用内存较高的软件</p></li><li><p>增加系统可用内存或虚拟内存</p></li></ol>'
category = '故障排查'
categoryColor = '#22C55E'
id = 'faq-053'
order = 47.0
question = '切片后软件卡死/内存不足？'

[[items]]
answer = '<p>默认情况下，处理后的 G-code 会直接覆盖原本的，在bbs的临时目录下。</p><p>如果找不到文件，请检查：</p><ol><li><p>导出目录是否具有写入权限</p></li><li><p>磁盘剩余空间是否充足</p></li></ol>'
category = '故障排查'
categoryColor = '#22C55E'
id = 'faq-054'
order = 48.0
question = '<p><span style="color: rgb(0, 0, 0);">处理后找不到 G-code 文件？</span></p>'

[[items]]
answer = '<p>后处理过程中，软件可能会为 G-code 添加额外的控制指令、注释信息或设备兼容代码，因此文件体积略有增加属于正常现象。</p><p>通常不会影响打印速度和打印质量。</p>'
category = '故障排查'
categoryColor = '#22C55E'
id = 'faq-055'
order = 49.0
question = '<p><span style="color: rgb(0, 0, 0);">为什么处理后的 G-code 文件体积变大了？</span></p>'

[[items]]
answer = '<p>后处理会在 G-code 中增加额外的运动指令，例如空驶移动、涂胶路径以及换笔动作，因此实际打印时间通常会比切片软件预估时间更长。</p><p>具体增加的时间取决于模型复杂度、换笔次数和涂胶量。一般情况下，实际打印时间比切片软件预估时间增加约 <strong>10%～30%</strong> 属于正常现象。</p>'
category = '故障排查'
categoryColor = '#22C55E'
id = 'faq-056'
order = 50.0
question = '处理后打印速度明显变慢？'

[[items]]
answer = '<p>一般只是A系列才会遇到</p><p>第二层结束后拓竹固件会<strong>强制裹头检测</strong>，而MKP机器预设会自动关闭此检测。</p><p>如果不用MKP机器预设打印，建议取下笔芯，避免裹头检测时碰到笔芯导致卡住。</p><p>快拆版取下笔芯，标准版取下整个前盖。</p>'
category = '故障排查'
categoryColor = '#22C55E'
id = 'faq-057'
order = 51.0
question = '不用MKP正常打印时第三层裹头检测卡住？'

[[items]]
answer = '<p>支撑界面间距由<strong>切片软件</strong>控制，不是MKP软件的参数。</p><p>如果没开熨烫，默认使用支撑面的间距无法调整。如果需要调整涂胶间距，可以打开熨烫功能</p><p>在切片软件的"支撑"设置中，打开“支撑熨烫”修改“支撑熨烫间距”。</p>'
category = '进阶技巧'
categoryColor = '#8B5CF6'
id = 'faq-058'
order = 52.0
question = '如何自定义支撑面涂胶间距？'

[[items]]
answer = '<p><strong>MKP 与切片软件生成的擦料塔并不冲突，无需关闭擦料塔功能。</strong></p><p>对于多色打印，建议保留切片软件默认的擦料塔设置。换色时产生的排料、冲刷和颜色过渡仍由擦料塔负责完成，而 MKP 仅负责额外的涂胶、换笔等后处理动作。</p>'
category = '进阶技巧'
categoryColor = '#8B5CF6'
id = 'faq-059'
order = 53.0
question = '多色打印下的支撑策略建议？'

[[items]]
answer = '<p>一种说法是管子阻力过大导致BMCU的<strong>霍尔传感器误判卡料</strong>，从而不断冲刷。</p><p>建议使用外挂耗材替代BMCU，避免传感器误判问题。</p><p>MKP 在打印过程中会增加额外的回抽、冲刷和换笔动作。</p><p>在部分 BMCU 设备上，频繁的耗材正反向运动可能触发异常检测机制，导致打印机重复执行冲刷流程。</p>'
category = '进阶技巧'
categoryColor = '#8B5CF6'
id = 'faq-060'
order = 54.0
question = 'BMCU+MKP一直冲刷怎么办？'

