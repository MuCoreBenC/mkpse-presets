[[items]]
answer = '<p><strong>不是必须的</strong>，新版软件可以不用，已经在后处理可以屏蔽第三层的裹头检测了。</p><p>下方工艺预设是必须的，支撑这一页的参数最好不要改，其他的可以改</p><img src="assets/faq/faq30_1.webp">'
