# notification.toml — 通知文案 SSOT (v2 七组字段架构)
#
# 所有 Supporte 业务代码通过 notify(id) 调用，不硬编码文案。
# id 即 TOML 表名（如 preset.download.success），与 Supporte 现有 i18n key 对齐便于迁移。
#
# v2 字段说明（七组）：
#   --- Identity ---
#   title       - 通知标题（可空字符串）
#   message     - 通知正文（支持 {{param}} Mustache 占位符）
#   --- Display ---
#   level       - info | success | warning | error | progress
#   icon        - 图标名（optional，playground/preview spec 使用）
#   duration    - 自动关闭时长（毫秒，0 表示不自动关闭；persistent=true 时忽略）
#   persistent  - 是否持久通知（true 表示需用户手动关闭）
#   --- Documentation ---
#   description - 通知语义说明（optional，知识中心展示）
#   category    - 业务分类数组（如 ['Preset']，按 ID 前缀推导）
#   tags        - 标签数组（optional，后续增量填充）
#   --- Trigger ---
#   triggers    - 触发场景数组 [[<id>.triggers]]（optional，label/page/component/action/description）
#   --- Source ---
#   sources     - 调用点数组 [[<id>.sources]]（file/line/function/label/owner/auto）
#                 owner = 业务归属（如 "Preset Download"），auto = true 表示 Builder 自动提取
#   --- Relations ---
#   related     - 关联通知数组 [[<id>.related]]（optional，id/reason/group/auto）
#   --- Metadata ---
#   event       - 引用 event ID（optional，event-domain spec 预留字段）
#   deprecated  - 是否废弃（optional，缺省 false）
#   since       - 引入版本（optional，后续增量填充）
#
# ID 命名规则：[a-z0-9.]+，遵循 <module>.<scenario>.<status> 模式
# Level/Duration 默认值：success/info/progress=3000ms, warning=4000ms, error=5000ms, persistent=0
#
# category 推导规则（按 ID 前缀）：
#   preset→['Preset'], param→['Param'], calibration→['Calibration'], machine→['Machine'],
#   update→['Update'], shadow→['Shadow'], startup→['Startup'], config→['Config'], file→['File'],
#   postprocess→['PostProcess']
#
# 总 ID 数：83（含 12 个未来扩展占位 ID + 71 个实际调用点引用的 ID）
# 71 个 ID 的 sources 从 migration-map.md 转录（auto=false 表示人工播种）
# 完整调用点 → ID 映射见 .trae/specs/migrate-toast-to-notify-api/migration-map.md

