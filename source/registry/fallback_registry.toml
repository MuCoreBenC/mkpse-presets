[[fallbacks]]
id = "prime_zero_value_defaults"
trigger = "Prime 组参数取零值（未设置）"
from = "零值/空"
to = "组默认值"
enabled = true
severity = "info"
desc = "L2 默认填充类：用户未设置（零值/空）时填默认，默认放行不留痕。Prime 组零值默认：PrimeLength→100、MinPathLength→5。"
reportField = "primeZeroDefaults"

[[fallbacks]]
id = "enum_empty_defaults"
trigger = "枚举字段为空/未设置"
from = "空/未设置"
to = "枚举默认值"
enabled = true
severity = "info"
desc = "L2 默认填充类：用户未设置（零值/空）时填默认，默认放行不留痕。枚举空/未设置默认：RibSpeedMode→follow、CustomLayerHeight→auto、WipeMode→auto、StaggerMode→off、SwingMode→spiral、Ironing.Mode→auto或off、SuppressExpandMode→bbox、OuterStructure→brim、ZCompMode→bed、XY,ZCalibration→default、CalibrationExecutionMode→print_then_calibrate、FastTowerMode→fast、BottomFillStyle→grid。"
reportField = "enumEmptyDefaults"

[[fallbacks]]
id = "machine_meta_fill_defaults"
trigger = "G-code 解析后 Machine 字段仍为 0"
from = "零值/空"
to = "元数据默认值"
enabled = true
severity = "info"
desc = "L2 默认填充类：用户未设置（零值/空）时填默认，默认放行不留痕。G-code 解析后 Machine 字段仍为 0 时填充：TravelSpeed→150、NozzleDiameter→0.4、FirstLayerHeight→0.2、TypicalLayerHeight→0.2、RetractLength→0.4、WallPrintSpeed→60。"
reportField = "machineMetaDefaults"

[[fallbacks]]
id = "dto_mapper_zero_defaults"
trigger = "DTO 映射时字段为零值/空"
from = "零值/空"
to = "映射默认值"
enabled = true
severity = "info"
desc = "L2 默认填充类：用户未设置（零值/空）时填默认，默认放行不留痕。DTO 映射零值默认：TowerFirstLayerFlow 0→1.0、outer_structure 空或 none→brim。"
reportField = "dtoMapperZeroDefaults"

[[fallbacks]]
id = "legacy_field_migration"
trigger = "检测到旧版字段（源数据迁移）"
from = "旧字段"
to = "新字段"
enabled = true
severity = "info"
desc = "L2 默认填充类：用户未设置（零值/空）时填默认，默认放行不留痕。旧字段迁移：MinHopDistance→GlueZLiftHeight、TowerWipeSpeed→SheathSpeed、RibSpeedValue 旧字段迁移到新结构。"
reportField = "legacyFieldMigration"

[[fallbacks]]
id = "toml_crlf_normalize_retry"
trigger = "TOML 解析失败（CRLF 行尾）"
from = "CRLF"
to = "LF"
enabled = true
severity = "info"
desc = "L2 默认填充类：用户未设置（零值/空）时填默认，默认放行不留痕。TOML 解析失败后先做 CRLF→LF 行尾规范化再重试解析，避免 Windows 行尾导致读取失败。"
reportField = "tomlCrlfRetry"

[[fallbacks]]
id = "filament_type_default"
trigger = "filament_settings_id 为空/未识别"
from = "空/未识别"
to = "推断或回退类型"
enabled = true
severity = "info"
desc = "L2 默认填充类：用户未设置（零值/空）时填默认，默认放行不留痕。由 filament_settings_id 推断 PETG/PLA，空值时回退 irData.Filament.Type。"
reportField = "filamentTypeDefault"
