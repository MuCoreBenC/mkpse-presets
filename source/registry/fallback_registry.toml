# fallback_registry — 运行时回退登记表 SSOT（Source Entity）
#
# 本文件是「运行时改写用户配置」类回退的唯一登记入口（spec: govern-fallback-and-param-validation）。
# Panel 编辑本文件（Entity），Builder 生成 content/fallback_registry.json（Artifact）并注册 manifest，
# 主应用经 seeds / 云端 content 同步消费。禁止手编 content/*.json。
#
# 字段含义：
#   id          回退唯一标识（后处理代码经 FallbackGate 按 id 查询，如 "support_fallback_to_tower"）
#   trigger     触发条件的中文描述（供 Panel 管理页与人读）
#   from        回退前的配置值（可含 "/" 分隔多个来源，如 "disk/none" = 圆盘或关闭擦拭）
#   to          回退后的目标值（如 "tower" = 擦料塔）
#   enabled     开关：true = 回退放行执行；false = 触发时报错中止（fail fast，不静默改写）
#   severity    回退记录的严重级别（warn / info / warning / error）
#   desc        回退行为的完整说明
#   reportField 后处理报告（meta.json detail）中承载该回退记录的字段名（兼容旧字段）
#
# 分级说明（spec: govern-fallback-and-param-validation 扩充）：
#   L1 改写类（severity = "warn"）  ：覆盖用户显式设置的非零/非空值时触发
#   L2 默认填充类（severity = "info"）：用户未设置（零值/空）时填默认，默认放行不留痕
#
# 元数据（参照 param_registry.toml 风格，人工维护、构建时透传）：
#   version     登记表结构版本
#   updated     最后编辑时间

version = 1
updated = '2026-08-19 17:20:00'

[[fallbacks]]
id = "support_fallback_to_tower"
trigger = "仅有支撑面无支撑体（无支撑体可擦）"
from = "disk/none"
to = "tower"
enabled = true
severity = "info"
desc = "圆盘擦拭/关闭擦拭在只有支撑面无支撑体时，强制回退为擦料塔以保证支撑面涂胶"
reportField = "supportFallback"

# ===== L1 改写类（warn）：覆盖用户显式设置的非零/非空值时触发 =====

[[fallbacks]]
id = "wiping_preferred_none_to_tower"
trigger = "需要擦拭但用户 PreferredMode 为 none/空/false（非支撑回退原因）"
from = 'none/""'
to = "tower"
enabled = true
severity = "warn"
desc = "L1 改写类：覆盖用户显式设置的非零/非空值时触发。需要擦拭但用户 PreferredMode 为 none/空/false（且非支撑回退原因）时，强制改写为擦料塔，保证擦拭流程可执行。"
reportField = "wipingPreferredFallback"

[[fallbacks]]
id = "gcode_meta_l803_infer"
trigger = "mount G-code 含 L803 时将 L803LeakPreventFlag 覆盖为 true"
from = "false/未设置"
to = "true"
enabled = true
severity = "warn"
desc = "L1 改写类：覆盖用户显式设置的非零/非空值时触发。mount G-code 含 L803 命令时，推断启用防漏液，将 L803LeakPreventFlag 覆盖为 true（G-code 元数据优先于表单值）。"
reportField = "l803LeakPreventInfer"

[[fallbacks]]
id = "gcode_meta_retract_infer"
trigger = "MKPRetract 为 0 时从 mount G-code G1 E 行反推；含正值→负值符号归一化覆盖"
from = "0/正值"
to = "G-code 反推值（负值）"
enabled = true
severity = "warn"
desc = "L1 改写类：覆盖用户显式设置的非零/非空值时触发。MKPRetract 为 0 时从 mount G-code 的 G1 E 行反回抽长度，并将正值归一化为负值（回抽方向约定）后覆盖。"
reportField = "mkpRetractInfer"

[[fallbacks]]
id = "gcode_meta_extrude_infer"
trigger = "MKPExtrude 为 0 时按 |mkpRetract|+0.5 推导（可被 unmount 正向 E 覆盖）"
from = "0"
to = "|mkpRetract|+0.5"
enabled = true
severity = "warn"
desc = "L1 改写类：覆盖用户显式设置的非零/非空值时触发。MKPExtrude 为 0 时按 |mkpRetract|+0.5 推导挤出长度；若 unmount G-code 存在正向 E 值则被其覆盖。"
reportField = "mkpExtrudeInfer"

[[fallbacks]]
id = "gcode_meta_wait_drying_infer"
trigger = "WaitForDryingCommand 为空时从 unmount G-code G4 行提取"
from = '""'
to = "G4 行提取值"
enabled = true
severity = "warn"
desc = "L1 改写类：覆盖用户显式设置的非零/非空值时触发。WaitForDryingCommand 为空时，从 unmount G-code 的 G4 停留行提取等待干燥指令填充。"
reportField = "waitDryingInfer"

[[fallbacks]]
id = "tree_support_extrusion_multiplier_override"
trigger = "G-code 元数据 TreeSupport 时将 SupportExtrusionMultiplier 覆盖为 1.27（仅覆盖显式非零值时）"
from = "显式非零值"
to = "1.27"
enabled = true
severity = "warn"
desc = "L1 改写类：覆盖用户显式设置的非零/非空值时触发。G-code 元数据标记 TreeSupport 时，将 SupportExtrusionMultiplier 覆盖为 1.27（树状支撑经验系数）；仅当覆盖用户显式非零值时视为改写。"
reportField = "treeSupportExtrusionOverride"

[[fallbacks]]
id = "ir_build_value_clamp"
trigger = "内部计算值超出边界被 clamp（仅内部计算源，用户参数源已改为报错）"
from = "超界内部计算值"
to = "边界值"
enabled = true
severity = "warn"
desc = "L1 改写类：覆盖用户显式设置的非零/非空值时触发。IR 构建期内部计算值超出边界时被 clamp 到边界；仅适用于内部计算来源，用户参数来源越界已改为报错中止（fail fast）。"
reportField = "irBuildValueClamp"

# ===== L2 默认填充类（info）：用户未设置（零值/空）时填默认，默认放行不留痕 =====

[[fallbacks]]
id = "tower_zero_value_defaults"
trigger = "Tower 组参数取零值（未设置）"
from = "零值/空"
to = "组默认值"
enabled = true
severity = "info"
desc = "L2 默认填充类：用户未设置（零值/空）时填默认，默认放行不留痕。Tower 组零值默认：SafeZOffset→0.7、TravelSpeed→300、GlueLayerSpeed→35、SheathSpeed←TowerWipeSpeed（无则 40）、RibSpeedValue→组默认、FirstLayerFlow→1.0。"
reportField = "towerZeroDefaults"

[[fallbacks]]
id = "disk_zero_value_defaults"
trigger = "Disk 组参数取零值（未设置）"
from = "零值/空"
to = "组默认值"
enabled = true
severity = "info"
desc = "L2 默认填充类：用户未设置（零值/空）时填默认，默认放行不留痕。Disk 组零值默认：StaggerAngle→5、StaggerMaxAngle→45。"
reportField = "diskZeroDefaults"

[[fallbacks]]
id = "ironing_zero_value_defaults"
trigger = "Ironing 组参数取零值（未设置）"
from = "零值/空"
to = "组默认值"
enabled = true
severity = "info"
desc = "L2 默认填充类：用户未设置（零值/空）时填默认，默认放行不留痕。Ironing 组零值默认：ESumThreshold→7.9。"
reportField = "ironingZeroDefaults"

[[fallbacks]]
id = "sheath_zero_value_defaults"
trigger = "Sheath 组参数取零值（未设置）"
from = "零值/空"
to = "组默认值"
enabled = true
severity = "info"
desc = "L2 默认填充类：用户未设置（零值/空）时填默认，默认放行不留痕。Sheath 组零值默认：BaseExpand→5、WallWidth→0.8、EnableHeight→70、ConvergeLayers→50。"
reportField = "sheathZeroDefaults"

[[fallbacks]]
id = "glue_zero_value_defaults"
trigger = "Glue 组参数取零值（未设置）"
from = "零值/空"
to = "组默认值"
enabled = true
severity = "info"
desc = "L2 默认填充类：用户未设置（零值/空）时填默认，默认放行不留痕。Glue 组零值默认：PassCount→1、ZLiftHeightFirstLayers→6、InterModelLiftHeight→2、ZLiftHeight←MinHopDistance。"
