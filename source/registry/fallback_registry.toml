# fallback_registry — 运行时回退登记表 SSOT（Source Entity）
#
# 本文件是「运行时改写用户配置」类回退的唯一登记入口（spec: govern-fallback-and-param-validation）。
# Panel 编辑本文件（Entity），Builder 生成 content/fallback_registry.json（Artifact）并注册 manifest，
# 主应用经 seeds / 云端 content 同步消费。禁止手编 content/*.json。
#
# ===== 字段含义（怎么改） =====
#   id          回退唯一标识（后处理代码经 FallbackGate 按 id 查询，如 "support_fallback_to_tower"）。
#               必填且全局唯一，新增时不要复用已有 id。
#   category    语义分类（一句话看懂每条在干嘛）：
#               override  强行改掉原来的值（你设了 A，程序用了 B）
#               infer     不知道就根据其他信息猜（G-code 元数据、回抽量反推等）
#               default   你没填就给默认值
#               migration 旧版字段名升级成新版字段名
#               recovery  正常方法失败了，换个办法再试
#   trigger     触发条件的中文描述（供 Panel 管理页与人读）
#   from        回退前的配置值（可含 "/" 分隔多个来源，如 "disk/none" = 圆盘或关闭擦拭）
#   to          回退后的目标值（如 "tower" = 擦料塔）
#   enabled     开关：true = 回退放行执行；false = 触发时报错中止（fail fast，不静默改写）
#   severity    严重级别（warn = L1 改写类；info = L2 默认填充类）
#   desc        回退行为的完整说明（建议用白话写清楚「什么时候、把什么改成什么」）
#   reportField 后处理报告（meta.json detail）中承载该回退记录的字段名（兼容旧字段）
#
# ===== 怎么关掉一条回退 =====
# 把对应条目的 enabled 改成 false：开启时放行执行（L1 留痕 / L2 补默认），
# 关闭后一旦触发就直接报错中止（fail fast），不再静默改写。
#
# ===== 级别（L1/L2 来源：spec govern-fallback-and-param-validation 与
# expand-fallback-registry-and-range-guards 定义的分级规则）=====
#   L1 改写类（severity = "warn"）：覆盖用户显式设置的非零/非空值时触发
#       → 经 FallbackGate：enabled=true 执行 + 写 meta.json detail.fallbacks 留痕；enabled=false 报错中止
#   L2 默认填充类（severity = "info"）：用户未设置（零值/空）时填默认
#       → 单点检查：enabled=true 放行（默认不留痕）；enabled=false 且存在零值 → 报错中止
#   L3 内部兜底：不进本清单，只在日志里带 fallbackId 可见（不改变处理结果）
#
# 顶层 guide 字段是给读 JSON 的人看的说明（这是什么 / 怎么改 / 级别 / 分类），
# 构建时透传到 content/fallback_registry.json（JSON 不能写注释，用 guide 补上）。
#
# 元数据（参照 param_registry.toml 风格，人工维护、构建时透传）：
#   version     登记表结构版本
#   updated     最后编辑时间

version = 1
updated = '2026-08-19 17:20:00'

guide = '''
# 这是什么？
本文件登记「后处理运行时改写用户配置」的回退行为清单，每条是一个 [[fallbacks]] 块。
它由 mkppanel 编辑 source/registry/fallback_registry.toml（Entity）生成；
禁止手改 content/*.json —— 改动请在 Panel「回退登记表」页或本 TOML 里做，然后构建 + 同步。

# 怎么改？
- 关掉某条：把该条 enabled 改为 false。开启 = 放行执行（L1 留痕 / L2 补默认）；
  关闭 = 一旦触发直接报错中止（fail fast），不再静默改写。
- 新增一条：加一个 [[fallbacks]] 块，id 必须全局唯一（代码按 id 查询），
  category/trigger/from/to/severity/desc/reportField 写清楚。
- severity 含义：warn = L1 改写类，info = L2 默认填充类。

# 级别（L1/L2 来源：spec govern-fallback-and-param-validation / expand-fallback-registry-and-range-guards）
- L1 改写类（severity=warn）：覆盖你显式设置的非零/非空值（元数据覆盖、模式强制切换、clamp 等）。
  开启 → 执行 + 留痕；关闭 → 报错中止。
- L2 默认填充类（severity=info）：你没设置（零值/空）时补默认。开启 → 放行不留痕；关闭且存在零值 → 报错。
- L3 内部兜底：不进本清单，只在日志里带 fallbackId 可见（不改变处理结果）。

# 语义分类（category）
- override  强行改掉原来的值（你设了 A，程序用了 B）
- infer     不知道就根据其他信息猜（G-code 元数据、回抽量反推等）
- default   你没填就给默认值
- migration 旧版字段名升级成新版字段名
- recovery  正常方法失败了，换个办法再试
'''

[[fallbacks]]
id = "support_fallback_to_tower"
category = "override"
trigger = "仅有支撑面无支撑体（无支撑体可擦）"
from = "disk/none"
to = "tower"
enabled = true
severity = "info"
desc = "圆盘擦拭/关闭擦拭在只有支撑面无支撑体时，强制改为擦料塔，保证支撑面能涂胶。"
reportField = "supportFallback"

# ===== L1 改写类（severity=warn）：覆盖用户显式设置的非零/非空值时触发 =====

[[fallbacks]]
id = "wiping_preferred_none_to_tower"
category = "override"
trigger = "需要擦拭但用户 PreferredMode 为 none/空/false（非支撑回退原因）"
from = 'none/""'
to = "tower"
enabled = true
severity = "warn"
desc = "需要擦拭但你选了 PreferredMode none/空/false（且不是支撑回退）时，强制改写为擦料塔，保证擦拭流程能跑。"
reportField = "wipingPreferredFallback"

[[fallbacks]]
