severity = "warn"
desc = "mount G-code 里有 L803 命令时，推断要防漏液，把 L803LeakPreventFlag 强制设为 true（G-code 元数据优先于表单值）。"
reportField = "l803LeakPreventInfer"

[[fallbacks]]
