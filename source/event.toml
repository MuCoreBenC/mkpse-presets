# event.toml — 业务事件 SSOT
# 定义业务事件，将通知按业务场景分组。Event 是知识中心的核心对象。
#
# 五层领域模型：
#   Event（业务事件）→ Notification（通知）→ Trigger（触发入口）→ Source（代码来源）→ Presentation（展示）
#
# 字段说明：
#   title         - 事件标题
#   description   - 事件描述（何时发生）
#   category      - 分类层级路径（如 ['Preset', 'Download']）
#   tags          - 标签
#   notifications - 属于该事件的通知 ID 列表（双向引用：Notification.event 反向指向 Event ID）
#   triggers/sources/related/description 本 spec 留空（架构就位，数据分阶段填充）
#
# Event ID 命名规则：event.<scenario>，scenario 与 notification ID 前缀对齐便于推导。
# 14 个 seed events 从 notification.toml 现有 83 个 ID 分组推导。

# ===== 预设模块事件（event.preset.*）=====

[event.download]
title = '下载预设'
description = ''
category = ['Preset', 'Download']
notifications = [
  'preset.download.success',
  'preset.download.deployedToSlicers',
  'preset.download.deployFailed',
  'preset.download.deployFailedWithMsg',
  'preset.download.alreadyLatest',
  'preset.download.genericSuccess',
  'preset.download.busy',
]

